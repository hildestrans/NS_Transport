<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fahrer-Einsatzplan N&amp;S</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: Arbeitsfläche mit Stammdaten links, Einträge rechts; auf dem Handy untereinander */
:root{
  --bg:#f3f5f4; --panel:#ffffff; --fg:#1d2624; --muted:#5d6b67; --line:#d8dfdc;
  --accent:#0f7a63; --accent-fg:#ffffff;
  --tour:#0f7a63; --urlaub:#b7791f; --krank:#c0392b;
  --display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a19; --panel:#1c2422; --fg:#e6ecea; --muted:#9aa8a4; --line:#2e3a37;
  --accent:#3fbf9c; --accent-fg:#0b1513; --tour:#3fbf9c; --urlaub:#e0a84a; --krank:#e8695a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a19; --panel:#1c2422; --fg:#e6ecea; --muted:#9aa8a4; --line:#2e3a37;
  --accent:#3fbf9c; --accent-fg:#0b1513; --tour:#3fbf9c; --urlaub:#e0a84a; --krank:#e8695a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px;max-width:1200px;margin:0 auto 18px}
h1{font:700 1.7rem/1.1 var(--display);margin:0;letter-spacing:.01em;text-wrap:balance}
h2{font:700 1.1rem/1.2 var(--display);margin:0 0 10px;text-transform:uppercase;letter-spacing:.06em}
.sub{color:var(--muted);font-size:.9rem}
.grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;max-width:1200px;margin:0 auto}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
label{display:flex;flex-direction:column;gap:3px;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
input,select{font:15px var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.row>*{flex:1 1 120px}
button{font:600 14px var(--body);border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;padding:8px 12px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.small{padding:3px 8px;font-size:12px}
button:hover{filter:brightness(.96)}
ul.list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
ul.list li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;background:var(--bg)}
ul.list li span{min-width:0;overflow-wrap:anywhere}
.times{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.88rem}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0;background:transparent}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.tablewrap{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.92rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.78rem;font-weight:600;border:1px solid currentColor}
.pill.Tour{color:var(--tour)} .pill.Urlaub{color:var(--urlaub)} .pill.Krank{color:var(--krank)}
.empty{color:var(--muted);padding:14px 4px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.stat{background:var(--bg);border-radius:6px;padding:6px 10px;font-size:.85rem}
.stat b{font-variant-numeric:tabular-nums}
.msg{font-size:.88rem;color:var(--accent);min-height:1.2em;margin-top:6px}
.check{flex-direction:row;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-size:.9rem}
.check input{width:auto}
.days{display:flex;flex-wrap:wrap;gap:4px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border-color:var(--krank);font-weight:600;font-variant-numeric:tabular-nums}
.sel{flex:0 0 auto;width:auto;padding:3px 4px;font-size:13px}
</style>
</head>
<body>
<header>
  <div>
    <h1>Fahrer-Einsatzplan</h1>
    <div class="sub">N&amp;S Transport GbR · Touren, Urlaub und Krankheit je Fahrer</div>
  </div>
  <div class="row" style="flex:0 1 auto">
    <button class="primary" type="button" id="btnImport">Stundenzettel (Excel) importieren</button><input type="file" id="fileImport" accept=".xlsx,.xls,.xlsm,.csv" multiple hidden>
    <button id="btnBackup">Sicherung speichern</button>
    <label class="check" style="cursor:pointer"><button type="button" id="btnRestore">Sicherung laden</button><input type="file" id="fileRestore" accept=".json" hidden></label>
  </div>
</header>

<div class="grid">
  <div class="col">
    <section class="panel">
      <h2>Fahrer</h2>
      <form id="fDriver" class="row">
        <select id="driverAnrede" style="flex:0 0 90px" aria-label="Anrede"><option>Herr</option><option>Frau</option></select>
        <input id="driverName" placeholder="Name des Fahrers" required>
        <button class="primary" style="flex:0 0 auto">Hinzufügen</button>
      </form>
      <ul class="list" id="driverList"></ul>
    </section>

    <section class="panel">
      <h2>Touren</h2>
      <form id="fTour" class="row">
        <label style="flex-basis:100%">Tourname<input id="tourName" placeholder="z. B. Tour 3 Hildesheim-Süd" required></label>
        <label>Beginn<input id="tourStart" type="time" value="07:00" required></label>
        <label>Pause<input id="tourPause" type="time" value="00:00"></label>
        <label>Ende<input id="tourEnd" type="time" value="15:30" required></label>
        <label style="flex-basis:100%">Stammfahrer<select id="tourDriver"></select></label>
        <div class="days" id="tourDays" style="flex-basis:100%">
          <label class="check"><input type="checkbox" value="1" checked>Mo</label><label class="check"><input type="checkbox" value="2" checked>Di</label><label class="check"><input type="checkbox" value="3" checked>Mi</label><label class="check"><input type="checkbox" value="4" checked>Do</label><label class="check"><input type="checkbox" value="5" checked>Fr</label><label class="check"><input type="checkbox" value="6">Sa</label><label class="check"><input type="checkbox" value="0">So</label>
        </div>
        <button class="primary" style="flex:0 0 auto">Hinzufügen</button>
      </form>
      <ul class="list" id="tourList"></ul>
    </section>
  </div>

  <div class="col">
    <section class="panel">
      <h2>Neuer Eintrag</h2>
      <div class="seg" role="group" aria-label="Art">
        <button type="button" data-type="Tour" aria-pressed="true">Tour</button>
        <button type="button" data-type="Urlaub" aria-pressed="false">Urlaub</button>
        <button type="button" data-type="Krank" aria-pressed="false">Krank</button>
      </div>
      <form id="fEntry" class="row" style="margin-top:12px">
        <label>Fahrer<select id="eDriver" required></select></label>
        <label id="lFrom">Datum<input id="eFrom" type="date" required></label>
        <label id="lTo" hidden>bis<input id="eTo" type="date"></label>
        <label id="lTour">Tour<select id="eTour"></select></label>
        <label id="lStart">Beginn<input id="eStart" type="time"></label>
        <label id="lPause">Pause<input id="ePause" type="time"></label>
        <label id="lEnd">Ende<input id="eEnd" type="time"></label>
        <label style="flex-basis:100%">Notiz<input id="eNote" placeholder="optional"></label>
        <label class="check" id="lSkip" hidden><input type="checkbox" id="eSkip" checked> Samstag und Sonntag auslassen</label>
        <button class="primary" style="flex:0 0 auto">Eintrag speichern</button>
      </form>
      <div class="msg" id="entryMsg"></div>
    </section>

    <section class="panel">
      <h2>Einträge</h2>
      <div class="row">
        <label>Fahrer<select id="flDriver"></select></label>
        <label>Von<input id="flFrom" type="date"></label>
        <label>Bis<input id="flTo" type="date"></label>
        <button id="btnPlan" style="flex:0 0 auto">Touren automatisch eintragen</button>
        <button class="primary" id="btnExport" style="flex:0 0 auto">Excel exportieren</button>
      </div>
      <div class="msg" id="planMsg"></div>
      <div class="stats" id="stats"></div>
      <div id="openBox" hidden>
        <h2 style="margin-top:14px;color:var(--krank)">Unbesetzte Touren <span id="openCount"></span></h2>
        <div class="sub" style="margin-bottom:6px">Antippen, dann nur noch den Fahrer wählen.</div>
        <div class="chips" id="openList"></div>
      </div>
      <div class="tablewrap">
        <table>
          <thead><tr><th>Datum</th><th>Tag</th><th>Fahrer</th><th>Art</th><th>Tour</th><th>Beginn</th><th>Pause</th><th>Ende</th><th>Std.</th><th>Notiz</th><th></th></tr></thead>
          <tbody id="entryBody"></tbody>
        </table>
      </div>
    </section>
  </div>
</div>

<script>
const KEY="ns_einsatzplan_v1";
const WD=["So","Mo","Di","Mi","Do","Fr","Sa"];
let db={drivers:[],tours:[],entries:[]};
try{const s=localStorage.getItem(KEY); if(s) db=JSON.parse(s);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}}
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const de=s=>{const [y,m,d]=s.split("-");return d+"."+m+"."+y;};
const pmin=p=>{const m=String(p||"").match(/(\d{1,2}):(\d{2})/);return m?+m[1]*60+ +m[2]:0;};
const pz=p=>pmin(p)?p:"";
function hours(a,b,p){if(!a||!b)return 0;const[h1,m1]=a.split(":").map(Number),[h2,m2]=b.split(":").map(Number);let t=(h2*60+m2)-(h1*60+m1);if(t<0)t+=1440;t=Math.max(0,t-pmin(p));return Math.round(t/60*100)/100;}
const fmtH=h=>h.toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2});

let type="Tour";
function setType(tp){
  type=tp;
  document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.type===tp));
  const isTour=type==="Tour";
  ["lTour","lStart","lPause","lEnd"].forEach(i=>$(i).hidden=!isTour);
  $("lTo").hidden=isTour; $("lSkip").hidden=isTour;
  $("lFrom").firstChild.textContent=isTour?"Datum":"Von";
}
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>setType(b.dataset.type));
const DEFDAYS=[1,2,3,4,5];
const tdays=t=>t.days||DEFDAYS;
const absent=(drv,ds)=>db.entries.some(e=>e.driver===drv&&e.date===ds&&e.type!=="Tour");
const tourEntry=(t,ds)=>db.entries.find(e=>e.type==="Tour"&&e.date===ds&&(e.tourId?e.tourId===t.id:e.tour===t.name));
function eachDay(f,t,cb){let d=parse(f),e=parse(t);while(d<=e){cb(iso(d),d.getDay());d.setDate(d.getDate()+1);}}
// Gesetzliche Feiertage Niedersachsen
const _hol={};
function feiertage(y){if(_hol[y])return _hol[y];
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);
  const mon=Math.floor((h+l-7*m+114)/31),day=((h+l-7*m+114)%31)+1,os=new Date(y,mon-1,day);
  const off=n=>{const x=new Date(os);x.setDate(x.getDate()+n);return iso(x);};
  return _hol[y]={[y+"-01-01"]:"Neujahr",[off(-2)]:"Karfreitag",[off(1)]:"Ostermontag",[y+"-05-01"]:"Tag der Arbeit",[off(39)]:"Christi Himmelfahrt",
    [off(50)]:"Pfingstmontag",[y+"-10-03"]:"Tag der Deutschen Einheit",[y+"-10-31"]:"Reformationstag",[y+"-12-25"]:"1. Weihnachtstag",[y+"-12-26"]:"2. Weihnachtstag"};}
const feiertag=ds=>feiertage(+ds.slice(0,4))[ds]||"";
const plannedOn=(t,ds,wd)=>tdays(t).includes(wd)&&(!t.created||ds>=t.created)&&!feiertag(ds);
function openSlots(){const f=$("flFrom").value,t=$("flTo").value;if(!f||!t||t<f)return[];const out=[];
  eachDay(f,t,(ds,wd)=>db.tours.forEach(tr=>{if(plannedOn(tr,ds,wd)&&!tourEntry(tr,ds))out.push({ds,tr});}));return out;}
function setTourDriver(id,v){const t=db.tours.find(t=>t.id===id);if(t){t.driver=v;save();render();}}
function fillSlot(ds,tid){setType("Tour");$("eFrom").value=ds;$("eTour").value=tid;$("eTour").onchange();
  $("eNote").value="";$("fEntry").scrollIntoView({behavior:"smooth",block:"center"});$("eDriver").focus();
  msg("Tour und Datum sind gewählt. Jetzt Fahrer wählen und speichern.");}

// Fahrer
$("fDriver").onsubmit=e=>{e.preventDefault();const n=$("driverName").value.trim();if(!n)return;
  if(db.drivers.some(d=>d.name.toLowerCase()===n.toLowerCase()))return;
  db.drivers.push({id:uid(),anrede:$("driverAnrede").value,name:n});$("driverName").value="";save();render();};
const full=d=>((d.anrede?d.anrede+" ":"")+d.name);
function setAnrede(id,v){const d=db.drivers.find(d=>d.id===id);if(d){d.anrede=v;save();render();}}
// Touren
$("fTour").onsubmit=e=>{e.preventDefault();const n=$("tourName").value.trim();if(!n)return;
  const days=[...document.querySelectorAll("#tourDays input:checked")].map(i=>+i.value);
  db.tours.push({id:uid(),name:n,start:$("tourStart").value,pause:$("tourPause").value,end:$("tourEnd").value,driver:$("tourDriver").value,days,created:iso(new Date())});
  $("tourName").value="";save();render();};

// Automatisch eintragen: jede Tour mit Stammfahrer an ihren Wochentagen, außer bei Urlaub/Krank
$("btnPlan").onclick=()=>{const f=$("flFrom").value,t=$("flTo").value;
  if(!f||!t||t<f){$("planMsg").textContent="Bitte oben einen gültigen Zeitraum (Von/Bis) wählen.";return;}
  let n=0,skip=0;
  eachDay(f,t,(ds,wd)=>db.tours.forEach(tr=>{
    const v=tw(tr,wd,ds);
    if(!v.driver||!plannedOn(tr,ds,wd)||tourEntry(tr,ds))return;
    if(absent(v.driver,ds)){skip++;return;}
    db.entries.push({id:uid(),driver:v.driver,date:ds,type:"Tour",tourId:tr.id,tour:tr.name,start:v.start,pause:v.pause||"",end:v.end,note:""});n++;}));
  save();render();
  $("planMsg").textContent=n+" Tour(en) eingetragen ("+de(f)+" bis "+de(t)+")."+(skip?" "+skip+" Tour(en) unbesetzt wegen Urlaub/Krank.":"");};
// Werte einer Tour an einem Wochentag (Abweichungen je Tag haben Vorrang)
function stammAm(t,ds){let d=t.driver||"";if(ds&&t.hist)t.hist.filter(h=>h.from<=ds).sort((a,b)=>a.from.localeCompare(b.from)).forEach(h=>d=h.driver);return d;}
function tw(t,wd,ds){const o=(t.wd&&t.wd[wd])||{};return {driver:o.driver||stammAm(t,ds),start:o.start||t.start,end:o.end||t.end,pause:o.pause!==undefined?o.pause:(t.pause||"")};}
$("eTour").onchange=()=>{const t=db.tours.find(t=>t.id===$("eTour").value);if(t){const f=$("eFrom").value;const v=tw(t,f?parse(f).getDay():-1,f);
  $("eStart").value=v.start;$("ePause").value=v.pause||"00:00";$("eEnd").value=v.end;}};
$("eFrom").addEventListener("change",()=>{if(type==="Tour")$("eTour").onchange();});
function addWd(id){const t=db.tours.find(t=>t.id===id);if(!t)return;const wd=+$("wd-"+id).value;
  const o={};const dr=$("wdd-"+id).value,st=$("wds-"+id).value,en=$("wde-"+id).value;
  if(dr)o.driver=dr;if(st)o.start=st;if(en)o.end=en;
  if(!Object.keys(o).length)return;t.wd=t.wd||{};t.wd[wd]=o;if(!tdays(t).includes(wd))t.days=[...tdays(t),wd];save();render();}
function addHist(id){const t=db.tours.find(t=>t.id===id);const f=$("hf-"+id).value,dr=$("hd-"+id).value;if(!t||!f||!dr)return;
  t.hist=(t.hist||[]).filter(h=>h.from!==f);t.hist.push({from:f,driver:dr});save();render();}
function delHist(id,f){const t=db.tours.find(t=>t.id===id);if(t&&t.hist){t.hist=t.hist.filter(h=>h.from!==f);save();render();}}
function delWd(id,wd){const t=db.tours.find(t=>t.id===id);if(t&&t.wd){delete t.wd[wd];save();render();}}

// Eintrag
$("fEntry").onsubmit=e=>{e.preventDefault();
  const drv=$("eDriver").value; if(!drv){msg("Bitte zuerst einen Fahrer anlegen.");return;}
  const from=$("eFrom").value; if(!from)return;
  if(type==="Tour"){
    const t=db.tours.find(t=>t.id===$("eTour").value);
    if(!t){msg("Bitte zuerst eine Tour anlegen.");return;}
    const stamm=tw(t,parse(from).getDay(),from).driver;
    const vert=stamm&&stamm!==drv?"Vertretung für "+dname(stamm):"";
    const note=$("eNote").value.trim()||vert;
    const ex=tourEntry(t,from);
    if(ex){const old=ex.driver;Object.assign(ex,{driver:drv,tourId:t.id,tour:t.name,start:$("eStart").value,end:$("eEnd").value,note});
      msg(old===drv?"Aktualisiert: "+de(from)+", "+t.name+".":t.name+" am "+de(from)+" fährt jetzt "+dname(drv)+" (statt "+dname(old)+").");}
    else{db.entries.push({id:uid(),driver:drv,date:from,type,tourId:t.id,tour:t.name,start:$("eStart").value,end:$("eEnd").value,note});
      msg("Gespeichert: "+de(from)+", "+t.name+", "+dname(drv)+".");}
  }else{
    const to=$("eTo").value||from; let d=parse(from),end=parse(to),n=0,freed=0;
    if(end<d){msg("Das Enddatum liegt vor dem Startdatum.");return;}
    while(d<=end){const wd=d.getDay();
      if(!($("eSkip").checked&&(wd===0||wd===6))){
        const ds=iso(d);
        const before=db.entries.length;
        db.entries=db.entries.filter(x=>!(x.driver===drv&&x.date===ds&&x.type==="Tour"));
        freed+=before-db.entries.length;
        db.entries=db.entries.filter(x=>!(x.driver===drv&&x.date===ds&&x.type!=="Tour"));
        db.entries.push({id:uid(),driver:drv,date:ds,type,tour:"",start:"",pause:"",end:"",note:$("eNote").value.trim()});n++;}
      d.setDate(d.getDate()+1);}
    msg(type+" gespeichert: "+n+" Tag(e)."+(freed?" "+freed+" Tour(en) sind jetzt unbesetzt, siehe unten.":""));
  }
  $("eNote").value="";save();render();};
function msg(t){$("entryMsg").textContent=t;}

function delDriver(id){if(db.entries.some(e=>e.driver===id)&&!$("del-"+id).dataset.armed){const b=$("del-"+id);b.dataset.armed=1;b.textContent="Wirklich? Einträge werden gelöscht";return;}
  db.drivers=db.drivers.filter(d=>d.id!==id);db.entries=db.entries.filter(e=>e.driver!==id);save();render();}
function delTour(id){db.tours=db.tours.filter(t=>t.id!==id);save();render();}
function delEntry(id){db.entries=db.entries.filter(e=>e.id!==id);save();render();}

function filtered(){const dr=$("flDriver").value,f=$("flFrom").value,t=$("flTo").value;
  return db.entries.filter(e=>(!dr||e.driver===dr)&&(!f||e.date>=f)&&(!t||e.date<=t))
    .sort((a,b)=>a.date.localeCompare(b.date)||(a.start||"").localeCompare(b.start||""));}
const dname=id=>{const d=db.drivers.find(d=>d.id===id);return d?full(d):"?";};

const sortedTours=()=>db.tours.slice().sort((a,b)=>(a.start||"").localeCompare(b.start||"")||a.name.localeCompare(b.name,"de",{numeric:true}));
function render(){
  $("driverList").innerHTML=db.drivers.map(d=>`<li><select class="small" style="flex:0 0 76px;padding:3px 4px;font-size:13px" aria-label="Anrede" onchange="setAnrede('${d.id}',this.value)">${["","Herr","Frau"].map(a=>`<option value="${a}"${(d.anrede||"")===a?" selected":""}>${a||"–"}</option>`).join("")}</select><span style="flex:1">${esc(d.name)}</span><button class="small" id="del-${d.id}" onclick="delDriver('${d.id}')">Löschen</button></li>`).join("")||'<li class="empty">Noch keine Fahrer. Namen oben eintragen.</li>';
  const opts=db.drivers.map(d=>`<option value="${d.id}">${esc(full(d))}</option>`).join("");
  const dayTxt=t=>[1,2,3,4,5,6,0].filter(x=>tdays(t).includes(x)).map(x=>WD[x]).join(" ");
  $("tourList").innerHTML=sortedTours().map(t=>`<li style="flex-wrap:wrap"><span style="flex:1 1 100%">${esc(t.name)} <span class="times">${t.start}–${t.end}${pmin(t.pause)?" (Pause "+t.pause+")":""} · ${dayTxt(t)}</span></span>
    <select class="sel" aria-label="Stammfahrer" onchange="setTourDriver('${t.id}',this.value)"><option value="">– kein Stammfahrer –</option>${db.drivers.map(d=>`<option value="${d.id}"${t.driver===d.id?" selected":""}>${esc(full(d))}</option>`).join("")}</select>
    <button class="small" onclick="delTour('${t.id}')">Löschen</button>
    ${Object.entries(t.wd||{}).map(([w,o])=>`<span class="times" style="flex:1 1 100%">${WD[w]}: ${o.driver?esc(dname(o.driver))+" · ":""}${o.start||t.start}–${o.end||t.end} <button class="small" onclick="delWd('${t.id}',${w})" aria-label="Abweichung entfernen">×</button></span>`).join("")}
    ${(t.hist||[]).map(h=>`<span class="times" style="flex:1 1 100%">ab ${de(h.from)}: ${esc(dname(h.driver))} <button class="small" onclick="delHist('${t.id}','${h.from}')" aria-label="Fahrerwechsel entfernen">×</button></span>`).join("")}
    <details style="flex:1 1 100%"><summary class="sub" style="cursor:pointer">Neuer Stammfahrer ab Datum</summary>
      <div class="row" style="margin-top:6px">
        <input id="hf-${t.id}" type="date" aria-label="ab Datum" style="flex:0 0 auto;width:auto">
        <select id="hd-${t.id}" class="sel">${db.drivers.map(d=>`<option value="${d.id}">${esc(full(d))}</option>`).join("")}</select>
        <button class="small" type="button" onclick="addHist('${t.id}')">Übernehmen</button>
      </div></details>
    <details style="flex:1 1 100%"><summary class="sub" style="cursor:pointer">Abweichung für einen Wochentag</summary>
      <div class="row" style="margin-top:6px">
        <select id="wd-${t.id}" class="sel">${[1,2,3,4,5,6,0].map(x=>`<option value="${x}">${WD[x]}</option>`).join("")}</select>
        <select id="wdd-${t.id}" class="sel"><option value="">gleicher Fahrer</option>${db.drivers.map(d=>`<option value="${d.id}">${esc(full(d))}</option>`).join("")}</select>
        <input id="wds-${t.id}" type="time" aria-label="Beginn" style="flex:0 0 auto;width:auto">
        <input id="wde-${t.id}" type="time" aria-label="Ende" style="flex:0 0 auto;width:auto">
        <button class="small" type="button" onclick="addWd('${t.id}')">Übernehmen</button>
      </div></details></li>`).join("")||'<li class="empty">Noch keine Touren. Name und Zeiten oben eintragen.</li>';
  const tdcur=$("tourDriver").value; $("tourDriver").innerHTML='<option value="">– kein Stammfahrer –</option>'+opts; $("tourDriver").value=tdcur;
  const cur=$("eDriver").value; $("eDriver").innerHTML=opts; if(cur)$("eDriver").value=cur;
  const fcur=$("flDriver").value; $("flDriver").innerHTML='<option value="">Alle Fahrer</option>'+opts; $("flDriver").value=fcur;
  const tcur=$("eTour").value; $("eTour").innerHTML=sortedTours().map(t=>`<option value="${t.id}">${esc(t.name)} (${t.start}–${t.end})</option>`).join("");
  if(tcur&&db.tours.some(t=>t.id===tcur))$("eTour").value=tcur; else $("eTour").onchange();
  const rows=filtered();
  $("entryBody").innerHTML=rows.map(e=>{const h=e.type==="Tour"?hours(e.start,e.end,e.pause):0;
    return `<tr><td>${de(e.date)}</td><td>${WD[parse(e.date).getDay()]}${feiertag(e.date)?` <span class="pill Urlaub" title="${feiertag(e.date)}">Feiertag</span>`:""}</td><td>${esc(dname(e.driver))}</td><td><span class="pill ${e.type}">${e.type}</span></td><td>${esc(e.tour)}</td><td>${e.start||""}</td><td>${pz(e.pause)}</td><td>${e.end||""}</td><td>${h?fmtH(h):""}</td><td>${esc(e.note)}</td><td><button class="small" onclick="delEntry('${e.id}')">×</button></td></tr>`}).join("")
    ||'<tr><td colspan="11" class="empty">Keine Einträge im gewählten Zeitraum.</td></tr>';
  const tours=rows.filter(r=>r.type==="Tour");
  $("stats").innerHTML=`<div class="stat">Tourtage <b>${new Set(tours.map(r=>r.driver+r.date)).size}</b></div>

    <div class="stat">Urlaubstage <b>${rows.filter(r=>r.type==="Urlaub").length}</b></div>
    <div class="stat">Krankheitstage <b>${rows.filter(r=>r.type==="Krank").length}</b></div>`;
  const open=openSlots();

  $("openCount").textContent="("+open.length+")";
  $("openList").innerHTML=open.slice(0,40).map(o=>`<button type="button" onclick="fillSlot('${o.ds}','${o.tr.id}')">${WD[parse(o.ds).getDay()]} ${de(o.ds).slice(0,6)} · ${esc(o.tr.name)}</button>`).join("")+(open.length>40?`<span class="sub">… und ${open.length-40} weitere</span>`:"");
}

// Excel: ein Sheet je Fahrer
$("btnExport").onclick=()=>{
  if(typeof XLSX==="undefined"){alert("Excel-Bibliothek nicht geladen. Bitte Internetverbindung prüfen.");return;}
  const rowsAll=filtered(); const wb=XLSX.utils.book_new();
  const drivers=$("flDriver").value?db.drivers.filter(d=>d.id===$("flDriver").value):db.drivers;
  const f=$("flFrom").value,t=$("flTo").value;
  const zeitraum=(f?de(f):"Anfang")+" – "+(t?de(t):"heute");
  const summary=[["N&S Transport GbR – Übersicht"],["Zeitraum",zeitraum],[],["Fahrer","Tourtage","Arbeitsstunden","Urlaubstage","Krankheitstage"]];
  const used=new Set();
  drivers.forEach(d=>{
    const rows=rowsAll.filter(r=>r.driver===d.id);
    const aoa=[["Fahrer",full(d)],["Zeitraum",zeitraum],[],["Datum","Wochentag","Art","Tour","Beginn","Pause","Ende","Stunden","Notiz"]];
    rows.forEach(r=>{const h=r.type==="Tour"?hours(r.start,r.end,r.pause):"";
      aoa.push([parse(r.date),WD[parse(r.date).getDay()],r.type,r.tour,r.start,pz(r.pause),r.end,h,[feiertag(r.date),r.note].filter(Boolean).join(", ")]);});
    const tr=rows.filter(r=>r.type==="Tour");
    const sumH=Math.round(tr.reduce((s,r)=>s+hours(r.start,r.end,r.pause),0)*100)/100;
    const days=new Set(tr.map(r=>r.date)).size, u=rows.filter(r=>r.type==="Urlaub").length, k=rows.filter(r=>r.type==="Krank").length;
    aoa.push([],["Summe Arbeitsstunden","","","","","","",sumH],["Tourtage",days],["Urlaubstage",u],["Krankheitstage",k]);
    summary.push([full(d),days,sumH,u,k]);
    const ws=XLSX.utils.aoa_to_sheet(aoa,{cellDates:true,dateNF:"dd.mm.yyyy"});
    ws["!cols"]=[{wch:20},{wch:10},{wch:9},{wch:26},{wch:8},{wch:7},{wch:8},{wch:9},{wch:30}];
    let n=d.name.replace(/[\\\/\?\*\[\]:]/g,"").slice(0,31)||"Fahrer",base=n,i=2;
    while(used.has(n)){n=base.slice(0,28)+" "+i++;} used.add(n);
    XLSX.utils.book_append_sheet(wb,ws,n);
  });
  const ws0=XLSX.utils.aoa_to_sheet(summary); ws0["!cols"]=[{wch:24},{wch:10},{wch:15},{wch:12},{wch:14}];
  XLSX.utils.book_append_sheet(wb,ws0,"Übersicht");
  wb.SheetNames.unshift(wb.SheetNames.pop());
  XLSX.writeFile(wb,"Einsatzplan_"+(f||"start")+"_bis_"+(t||iso(new Date()))+".xlsx");
};

// Fahrer + Touren zusammenführen (ohne bestehende Daten zu löschen)
function mergeDrivers(list){let nd=0,nt=0;
  list.forEach(p=>{
    let d=db.drivers.find(x=>x.name.toLowerCase()===p.name.toLowerCase());
    if(!d){d={id:uid(),anrede:p.anrede||"",name:p.name};db.drivers.push(d);nd++;}
    else if(!d.anrede&&p.anrede)d.anrede=p.anrede;
    p.tours.forEach(t=>{
      let tr=db.tours.find(x=>x.name.toLowerCase()===t.name.toLowerCase());
      if(!tr){tr={id:uid(),name:t.name,start:t.start,pause:t.pause||"",end:t.end,driver:d.id,days:t.days};db.tours.push(tr);nt++;
        if(t.wd)tr.wd=JSON.parse(JSON.stringify(t.wd));}
      else{if(!tr.driver)tr.driver=d.id;if(tr.pause===undefined&&t.pause)tr.pause=t.pause;}
    });
  });
  return {nd,nt};}

// Stundenzettel lesen: "Name des Mitarbeiters", Spalten "Tor No.", "Beginn", "Ende"
function toHM(f,r){const m=String(f).match(/(\d{1,2}):(\d{2})/);
  if(m)return String(+m[1]%24).padStart(2,"0")+":"+m[2];
  if(typeof r==="number"&&r>=0&&r<2){const mins=Math.round((r%1)*1440);return String(Math.floor(mins/60)%24).padStart(2,"0")+":"+String(mins%60).padStart(2,"0");}
  return "";}
function toDate(f,r){const m=String(f).match(/(\d{1,2})\.(\d{1,2})\.(\d{2,4})/);
  if(m){let y=+m[3];if(y<100)y+=2000;const d=new Date(y,+m[2]-1,+m[1]);if(d.getMonth()===+m[2]-1&&d.getDate()===+m[1])return d;return null;}
  if(typeof r==="number"&&r>20000){const c=XLSX.SSF.parse_date_code(r);return new Date(c.y,c.m-1,c.d);}
  return null;}
function parseWorkbook(wb){const people=[];
  wb.SheetNames.forEach(sn=>{const ws=wb.Sheets[sn];
    const F=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:""}),R=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""});
    let person=null,cols=null,lastDate=null;
    F.forEach((row,i)=>{const cells=row.map(c=>String(c).trim());
      const ni=cells.findIndex(c=>/name des mitarbeiters/i.test(c));
      if(ni>=0){let nm=cells.slice(ni+1).find(c=>c)||"";let an="";
        const am=nm.match(/^(Herr|Frau)\s+(.*)$/i);if(am){an=am[1][0].toUpperCase()+am[1].slice(1).toLowerCase();nm=am[2].trim();}
        if(nm){person=people.find(p=>p.name===nm);if(!person){person={anrede:an,name:nm,map:{}};people.push(person);}}
        cols=null;return;}
      const ti=cells.findIndex(c=>/^tou?r\b/i.test(c));
      if(ti>=0&&cells.some(c=>/beginn/i.test(c))){cols={date:cells.findIndex(c=>/kalendertag|datum/i.test(c)),tour:ti,
        start:cells.findIndex(c=>/^beginn/i.test(c)),end:cells.findIndex(c=>/^ende/i.test(c)),pause:cells.findIndex(c=>/^pause/i.test(c))};if(cols.date<0)cols.date=0;lastDate=null;return;}
      if(!person||!cols)return;
      const tname=cells[cols.tour];
      const dt=toDate(cells[cols.date],R[i]&&R[i][cols.date]);
      if(cells[cols.date])lastDate=dt; const useDate=cells[cols.date]?dt:lastDate;
      if(!tname||/sonntag|summe/i.test(tname))return;
      const s=toHM(cells[cols.start],R[i]&&R[i][cols.start]),e=toHM(cells[cols.end],R[i]&&R[i][cols.end]);
      if(!s||!e||(s==="00:00"&&e==="00:00"))return;
      const t=person.map[tname]||(person.map[tname]={name:tname,times:{},days:new Set()});
      const pa=cols.pause>=0?toHM(cells[cols.pause],R[i]&&R[i][cols.pause]):"";const k=s+"-"+e+"-"+(pa==="00:00"?"":pa);t.times[k]=(t.times[k]||0)+1;
      if(useDate)t.days.add(useDate.getDay());
    });
  });
  return people.map(p=>({anrede:p.anrede,name:p.name,tours:Object.values(p.map).map(t=>{
    const k=Object.entries(t.times).sort((a,b)=>b[1]-a[1])[0][0].split("-");
    return {name:t.name,start:k[0],end:k[1],pause:k[2]||"",days:t.days.size?[...t.days].sort():DEFDAYS.slice()};})})).filter(p=>p.tours.length||p.name);}
$("btnImport").onclick=()=>$("fileImport").click();
$("fileImport").onchange=async e=>{
  if(typeof XLSX==="undefined"){alert("Excel-Bibliothek nicht geladen. Bitte Internetverbindung prüfen.");return;}
  let all=[];
  for(const fl of e.target.files){try{const wb=XLSX.read(await fl.arrayBuffer(),{type:"array"});all=all.concat(parseWorkbook(wb));}catch(x){}}
  e.target.value="";
  if(!all.length){$("planMsg").textContent="In der Datei wurde kein Stundenzettel gefunden (Zeile „Name des Mitarbeiters“ und Spalten Tour/Beginn/Ende).";return;}
  const r=mergeDrivers(all);save();render();
  $("planMsg").textContent="Import: "+all.map(p=>(p.anrede?p.anrede+" ":"")+p.name+" ("+p.tours.map(t=>t.name+" "+t.start+"–"+t.end).join(", ")+")").join("; ")+". Neu: "+r.nd+" Fahrer, "+r.nt+" Tour(en).";
  $("planMsg").scrollIntoView({behavior:"smooth",block:"center"});};
